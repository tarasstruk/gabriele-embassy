[package]
name = "gabriele-embassy"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "main"
path = "src/main.rs"
test = false
bench = false

[dependencies]
defmt = "1.0.1"
defmt-rtt = "1.0.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
cortex-m-rt = "0.7.5"
embassy-executor = { version = "0.9.0", features = ["arch-cortex-m", "executor-thread", "defmt"] }
embassy-futures = "0.1.2"
embassy-rp = { version = "0.9.0", features = ["defmt", "time-driver", "critical-section-impl", "rp2040"] }
embassy-sync = { version = "0.7.2", features = ["defmt"]}
embassy-usb = { version = "0.5.1", features = ["defmt"]}
fixed = "1.29.0"
critical-section = "1.1"
cyw43 = { version = "0.6.0", features = ["defmt"] }
cyw43-pio = { version = "0.9.0", features = ["defmt"] }
embassy-time = "0.5.0"
embedded-io-async = { version = "0.7.0", features = ["defmt"] }
static_cell = "2.1.1"
embassy-net = { version = "0.8.0", features = ["defmt", "dhcpv4", "tcp"] }
portable-atomic = { version = "1", features = ["critical-section"] }
# panic-halt = "1.0.0"
# rp2040-boot2 = "0.3.0"
gabriele = { path = "../gabriele/gabriele" }
